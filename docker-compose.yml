version: '2'
volumes:
    influxdb-data:
    dashboard-data:
services:
  influxdb:
    image: arm64v8/influxdb:1.8.6
    container_name: influxdb
    restart: always
    environment:
      - INFLUXDB_DB=balena
      - INFLUXDB_USER=balena
      - INFLUXDB_ADMIN_ENABLED=true
      - INFLUXDB_ADMIN_USER=admin
      - INFLUXDB_ADMIN_PASSWORD=admin
    volumes:
      - 'influxdb-data:/var/lib/influxdb'
    ports:
      - "8086:8086"
  dashboard:
    build: ./dashboard
    restart: always
    expose:
      - '80'
    volumes:
      - 'dashboard-data:/data'
    depends_on:
      - influxdb
  sensor:
    privileged: true
    build: ./sensor
    restart: always
    depends_on:
     - influxdb
     - dashboard
  messenger:
    privileged: true
    build: ./messenger
    restart: always
    ports:
      - "5000"
      - "22"
  mqtt:
    build: ./mqtt
    restart: always
    ports:
      - "1883"
      - "9001"
  nginx:
    build: ./nginx
    ports:
      - '80:80'
  telegraf:
    build: ./telegraf
    privileged: true
    restart: always
    depends_on:
      - mqtt
      - influxdb
